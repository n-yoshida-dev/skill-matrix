name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい push があったら、走っている古いジョブを止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # frontend/ backend/ がまだ無い段階でも CI が赤くならないよう、存在を見てから走らせる
  detect:
    name: 対象の検出
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
      backend: ${{ steps.check.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f backend/go.mod ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: frontend (lint / typecheck / test / build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存をインストール
        run: npm ci

      - name: フォーマット崩れがないか
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: 型チェック
        run: npm run typecheck

      - name: 単体テスト
        run: npm run test

      - name: ビルド
        run: npm run build

      # E2E（TODO 2-6）はジョブを分けずにここで走らせる。ジョブ名を変える・増やすと、
      # main のブランチ保護の必須チェック名と dashboard/update.mjs の読み取りも直す必要があるため（CLAUDE.md「開発ダッシュボード」）
      - name: E2E 用のブラウザを入れる
        run: npx playwright install --with-deps chromium

      - name: E2E（JSON を差し替えると画面が変わるか）
        run: npm run e2e

  backend:
    name: backend (vet / test / build)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # internal/store の DB テスト用。docker-compose.yml の postgres と同じ設定にしてある
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skillmatrix
          POSTGRES_PASSWORD: skillmatrix
          POSTGRES_DB: skillmatrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillmatrix -d skillmatrix"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: フォーマット崩れがないか
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: テスト
        env:
          # 未設定だと DB テストはスキップされる。CI では必ず走らせる
          TEST_DATABASE_URL: postgres://skillmatrix:skillmatrix@localhost:5432/skillmatrix?sslmode=disable
        run: go test ./...

      - name: ビルド
        run: go build ./...

  # data/ の判定と理解度が整合しているかを見る（SPEC.md §6）。
  # backend のテストとは別ジョブにして、赤くなったときに「データの不備」だとチェック名で分かるようにする。
  # 判定ファイルの崩れ・棄却の残り・state.json の再計算忘れや手編集で落ちる
  data:
    name: data/ の検証（verify）
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 判定を検証し、state.json が再計算結果と一致するか
        run: go run ./cmd/skillmatrix verify --data ../data

  no-secrets:
    name: 秘密情報が混入していないか
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: 追跡対象に秘密情報が含まれていないことを確認
        run: |
          # .gitignore は git add -f で貫通できるため、CI でも独立して検査する
          HITS=$(git ls-files \
            | grep -E '(^|/)(PRIVATE\.md|CLAUDE\.local\.md|\.env(\..+)?)$|\.local\.(json|md)$|(^|/)(secrets|data/private|learning-logs)/|(^|/)credentials\.json$|\.(pem|key|p12|keystore)$' \
            | grep -v '\.env\.example$' || true)
          if [ -n "$HITS" ]; then
            echo "::error::秘密情報がリポジトリに含まれています"
            echo "$HITS"
            exit 1
          fi
          echo "秘密情報の混入なし"
